<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Windlass · Tasks</title>
  <link rel="icon" type="image/png" href="/favicon-32.png?v=3">
  <link rel="stylesheet" href="/styles.css">
  <script src="/tasks.js" type="module"></script>
</head>
<body>
  <header><a class="brand" href="/">◈ Windlass</a><nav class="header-nav" aria-label="Workspace"><a class="automations-link" href="/">Notifications</a><a class="automations-link" href="/tasks.html" aria-current="page">Tasks</a><a class="automations-link" href="/ref-docs.html">ref-docs</a><a class="automations-link" href="/json-conf.html">json-conf</a><a class="automations-link" href="/backups.html">n8n backups</a></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">ONE STEP AT A TIME</p><h1 id="library-title">Tasks</h1><p class="muted">Organize work and track its steps.</p></div><button id="new">+ New task</button></div>
    <div class="actions" aria-label="Task library"><button id="show-tasks" class="secondary" aria-pressed="true">Tasks</button><button id="show-templates" class="secondary" aria-pressed="false">Task templates</button></div>
    <form id="search-form" class="toolbar task-toolbar"><label for="search">Search tasks</label><input id="search" type="search" placeholder="Search names, descriptions, or metadata…"><label for="status-filter">Status</label><select id="status-filter"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="EXECUTING">Executing</option><option value="WAITING">Waiting</option><option value="DONE">Done</option><option value="SKIPPED">Skipped</option></select><button type="submit" class="secondary">Search</button><button id="refresh" type="button" class="secondary">Refresh</button></form>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="list-heading"><h2><span id="list-title">Tasks</span> <span id="count">0</span></h2><span class="muted">Sorted by name</span></div>
    <div id="tasks" class="task-list" role="list" aria-label="Tasks and templates"></div>
    <nav class="actions pagination" aria-label="Task pages"><button id="previous" class="secondary" disabled>Previous</button><span id="page-info" aria-live="polite"></span><button id="next" class="secondary" disabled>Next</button></nav>
  </main>
</body>
</html>
