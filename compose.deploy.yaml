# Standalone deployment: use this file by itself, not as a development override.
name: windlass-deployment

services:
  windlass:
    image: ${WINDLASS_IMAGE:-ghcr.io/rakorth/windlass:latest}
    platform: linux/amd64
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WINDLASS_PORT:-6080}:8080"
    environment:
      JSON_CONF_DIRECTORY: /json-conf
      REF_DOCS_DIRECTORY: /ref-docs
      DATABASE_URL: jdbc:sqlite:/data/notifications.db
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
      WINDLASS_MCP_ENABLED: ${WINDLASS_MCP_ENABLED:-true}
    volumes:
      - ${JSON_CONF_HOST_DIRECTORY:-./json-conf}:/json-conf
      - ${REF_DOCS_HOST_DIRECTORY:-./ref-docs}:/ref-docs
      - windlass-data:/data
    restart: unless-stopped

volumes:
  windlass-data:
